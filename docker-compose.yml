services:
  drupal:
    image: drupal:latest # Or your preferred version from Docker Hub
    container_name: drupal_web
    restart: always
    volumes:
      # Bind mount for local development (syncs code, themes, and modules)
      - ./web:/var/www/html
      # Named volume for persistent public files (managed by Docker)
      - drupal_files:/var/www/html/sites/default/files
    environment:
      - DRUPAL_DATABASE_HOST=db
      - DRUPAL_DATABASE_NAME=drupaldb
      - DRUPAL_DATABASE_USERNAME=drupaluser
      - DRUPAL_DATABASE_PASSWORD=strongpassword
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:10.11 # Or mysql:8.0
    container_name: drupal_db
    restart: always
    volumes:
      # Named volume to keep database records completely safe across restarts
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: drupaldb
      MYSQL_USER: drupaluser
      MYSQL_PASSWORD: strongpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
volumes:
  drupal_files:
  db_data:
